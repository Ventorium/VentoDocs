[workspace]
resolver = "2"
members = [
    "crates/vk-core",
    "crates/vk-store",
    "crates/vk-api",
    "crates/vk-app",
    "crates/vk-convert",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
# Web 框架
axum = { version = "0.8", features = ["multipart", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 数据库
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# 错误处理
thiserror = "2"
anyhow = "1"
# HTTP 客户端（v2 Agent 用）
reqwest = { version = "0.12", features = ["json", "stream"] }
# 加密
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
# 文件
futures-util = "0.3"
bytes = "1"
# Office → Univer 快照转换（M2 在线预览/编辑）
calamine = { version = "0.37", features = ["dates"] }
quick-xml = { version = "0.42", features = ["encoding"] }
zip = "2"
encoding_rs = "0.8"
docx-rs = "0.4.22"

[profile.release]
lto = true
strip = true
